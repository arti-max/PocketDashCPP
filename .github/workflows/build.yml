name: Multiplatform Build (Windows, macOS, iOS, Android, Linux)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build configuration (debug or release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/') || github.event.inputs.build_mode == 'release' }}

jobs:
  # ====================================================================
  # Windows x64 Build
  # ====================================================================
  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Disable Windows Defender
        shell: pwsh
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
          Set-MpPreference -DisableBehaviorMonitoring $true -ErrorAction SilentlyContinue
          Set-MpPreference -DisableScriptScanning $true -ErrorAction SilentlyContinue

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup sccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          variant: sccache
          key: windows-sccache-${{ env.IS_RELEASE }}
          max-size: 2G

      - name: Cache Axmol Engine
        id: cache-axmol
        uses: actions/cache@v4
        with:
          path: C:/axmol
          key: axmol-release-2.x-windows

      - name: Setup Axmol Engine
        if: steps.cache-axmol.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git clone --depth 1 -b release/2.x https://github.com/axmolengine/axmol.git C:/axmol
          cd C:/axmol
          ./setup.ps1

      - name: Build PocketDash (Windows)
        shell: pwsh
        run: |
          $env:AX_ROOT = "C:/axmol"
          $env:PATH = "C:/axmol/tools/cmdline;$env:PATH"
          $env:CMAKE_C_COMPILER_LAUNCHER = "sccache"
          $env:CMAKE_CXX_COMPILER_LAUNCHER = "sccache"
          $opt = if ("${{ env.IS_RELEASE }}" -eq "true") { "-O3" } else { "-O0" }
          axmol build -p win32 -a x64 -t PocketDash $opt

      - name: Package Windows Binary & Assets
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path . -Recurse -File -Filter "PocketDash.exe" | Select-Object -First 1
          if (-not $exe) {
            Write-Error "Could not locate PocketDash.exe"
            exit 1
          }
          $binDir = $exe.DirectoryName
          Compress-Archive -Path "$binDir/*" -DestinationPath "PocketDash-Windows-x64.zip"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketDash-Windows-x64
          path: PocketDash-Windows-x64.zip
          retention-days: 14

  # ====================================================================
  # macOS (Apple Silicon / arm64) Build
  # ====================================================================
  macos:
    name: macOS (arm64)
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          variant: ccache
          key: macos-ccache-${{ env.IS_RELEASE }}
          max-size: 2G

      - name: Cache Axmol Engine
        id: cache-axmol
        uses: actions/cache@v4
        with:
          path: ~/axmol
          key: axmol-release-2.x-macos-15

      - name: Setup Axmol Engine
        if: steps.cache-axmol.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone --depth 1 -b release/2.x https://github.com/axmolengine/axmol.git ~/axmol
          cd ~/axmol
          pwsh ./setup.ps1

      - name: Build PocketDash (macOS)
        shell: bash
        run: |
          export AX_ROOT="${HOME}/axmol"
          export PATH="${HOME}/axmol/tools/cmdline:${PATH}"
          export CMAKE_C_COMPILER_LAUNCHER=ccache
          export CMAKE_CXX_COMPILER_LAUNCHER=ccache
          OPT_FLAG=$([ "$IS_RELEASE" = "true" ] && echo "-O3" || echo "-O0")
          axmol build -p osx -a arm64 -t PocketDash $OPT_FLAG -xc '-DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO,-DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO'

      - name: Package macOS Application (.app)
        shell: bash
        run: |
          APP_DIR=$(find . -name "PocketDash.app" -type d | grep -v "ios" | grep -v "sim" | head -n 1)
          if [ -z "$APP_DIR" ]; then
            echo "Error: PocketDash.app not found!"
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$APP_DIR" "PocketDash-macOS.zip"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketDash-macOS
          path: PocketDash-macOS.zip
          retention-days: 14

  # ====================================================================
  # iOS Build (Device IPA + Simulator App)
  # ====================================================================
  ios:
    name: iOS (Device & Simulator)
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          variant: ccache
          key: ios-ccache-${{ env.IS_RELEASE }}
          max-size: 2G

      - name: Cache Axmol Engine
        id: cache-axmol
        uses: actions/cache@v4
        with:
          path: ~/axmol
          key: axmol-release-2.x-macos-15

      - name: Setup Axmol Engine
        if: steps.cache-axmol.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone --depth 1 -b release/2.x https://github.com/axmolengine/axmol.git ~/axmol
          cd ~/axmol
          pwsh ./setup.ps1

      - name: Build iOS Device (arm64)
        shell: bash
        run: |
          export AX_ROOT="${HOME}/axmol"
          export PATH="${HOME}/axmol/tools/cmdline:${PATH}"
          export CMAKE_C_COMPILER_LAUNCHER=ccache
          export CMAKE_CXX_COMPILER_LAUNCHER=ccache
          OPT_FLAG=$([ "$IS_RELEASE" = "true" ] && echo "-O3" || echo "-O0")
          axmol build -p ios -a arm64 -t PocketDash $OPT_FLAG -xc '-DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY=,-DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO,-DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO'

      - name: Package iOS Device IPA
        shell: bash
        run: |
          APP_DIR=$(find . -path "*ios*" -name "PocketDash.app" -type d | grep -v "sim" | head -n 1)
          if [ -n "$APP_DIR" ]; then
            mkdir -p Payload
            cp -R "$APP_DIR" Payload/
            zip -qr "PocketDash-iOS.ipa" Payload
            rm -rf Payload
          fi

      - name: Build iOS Simulator (arm64)
        shell: bash
        run: |
          export AX_ROOT="${HOME}/axmol"
          export PATH="${HOME}/axmol/tools/cmdline:${PATH}"
          export CMAKE_C_COMPILER_LAUNCHER=ccache
          export CMAKE_CXX_COMPILER_LAUNCHER=ccache
          OPT_FLAG=$([ "$IS_RELEASE" = "true" ] && echo "-O3" || echo "-O0")
          axmol build -p ios -a arm64 -sdk simulator -t PocketDash $OPT_FLAG

      - name: Package iOS Simulator App
        shell: bash
        run: |
          SIM_DIR=$(find . -path "*sim*" -name "PocketDash.app" -type d | head -n 1)
          if [ -n "$SIM_DIR" ]; then
            ditto -c -k --sequesterRsrc --keepParent "$SIM_DIR" "PocketDash-iOS-Simulator.zip"
          fi

      - name: Upload iOS Device IPA
        if: hashFiles('PocketDash-iOS.ipa') != ''
        uses: actions/upload-artifact@v4
        with:
          name: PocketDash-iOS-Device-IPA
          path: PocketDash-iOS.ipa
          retention-days: 14

      - name: Upload iOS Simulator App
        if: hashFiles('PocketDash-iOS-Simulator.zip') != ''
        uses: actions/upload-artifact@v4
        with:
          name: PocketDash-iOS-Simulator
          path: PocketDash-iOS-Simulator.zip
          retention-days: 14

  # ====================================================================
  # Android Build (arm64 APK: Debug or Signed Release)
  # ====================================================================
  android:
    name: Android (arm64 APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Axmol Engine
        id: cache-axmol
        uses: actions/cache@v4
        with:
          path: /home/runner/axmol
          key: axmol-release-2.x-android

      - name: Clone Axmol Engine
        if: steps.cache-axmol.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone --depth 1 -b release/2.x https://github.com/axmolengine/axmol.git ${HOME}/axmol

      - name: Setup Axmol & Dependencies
        shell: bash
        run: |
          sudo chown -R $USER:$USER /usr/local/lib/android/sdk || true
          echo -e "y" | pwsh ${HOME}/axmol/setup.ps1

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          variant: ccache
          key: android-ccache-${{ env.IS_RELEASE }}
          max-size: 2G

      - name: Build Android APK
        shell: bash
        run: |
          export AX_ROOT="${HOME}/axmol"
          export PATH="${HOME}/axmol/tools/cmdline:${PATH}"
          export NDK_CCACHE="$(which ccache)"
          export CMAKE_C_COMPILER_LAUNCHER=ccache
          export CMAKE_CXX_COMPILER_LAUNCHER=ccache
          chmod +x proj.android/gradlew
          OPT_FLAG=$([ "$IS_RELEASE" = "true" ] && echo "-O3" || echo "-O0")
          axmol build -p android -a arm64 $OPT_FLAG

      - name: Sign & Package Android APK
        shell: bash
        run: |
          if [ "$IS_RELEASE" = "true" ]; then
            RAW_APK=$(find proj.android -path "*release*" -name "*.apk" -type f | head -n 1)
            if [ -z "$RAW_APK" ]; then
              echo "Error: Release APK not found!"
              find proj.android -name "*.apk" || true
              exit 1
            fi

            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
            BUILD_TOOLS=$(ls -d /usr/local/lib/android/sdk/build-tools/* | sort -V | tail -n 1)

            "$BUILD_TOOLS/zipalign" -f -p 4 "$RAW_APK" aligned.apk
            "$BUILD_TOOLS/apksigner" sign \
              --ks release.keystore \
              --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
              --ks-pass "pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
              --key-pass "pass:${{ secrets.ANDROID_KEY_PASSWORD }}" \
              --out "PocketDash-Android-arm64.apk" \
              aligned.apk
            rm -f release.keystore aligned.apk
          else
            APK_FILE=$(find proj.android -name "*.apk" -type f | head -n 1)
            if [ -z "$APK_FILE" ]; then
              echo "Error: Debug APK not found!"
              exit 1
            fi
            cp "$APK_FILE" "PocketDash-Android-arm64.apk"
          fi

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketDash-Android-arm64
          path: PocketDash-Android-arm64.apk
          retention-days: 14

  # ====================================================================
  # Linux x64 Build
  # ====================================================================
  linux:
    name: Linux (x64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          variant: ccache
          key: linux-ccache-${{ env.IS_RELEASE }}
          max-size: 2G

      - name: Cache Axmol Engine
        id: cache-axmol
        uses: actions/cache@v4
        with:
          path: /home/runner/axmol
          key: axmol-release-2.x-linux

      - name: Clone Axmol Engine
        if: steps.cache-axmol.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone --depth 1 -b release/2.x https://github.com/axmolengine/axmol.git ${HOME}/axmol

      - name: Install Linux System Dependencies
        shell: bash
        run: |
          echo -e "y" | pwsh ${HOME}/axmol/setup.ps1

      - name: Build PocketDash (Linux)
        shell: bash
        run: |
          export AX_ROOT="${HOME}/axmol"
          export PATH="${HOME}/axmol/tools/cmdline:${PATH}"
          export CMAKE_C_COMPILER_LAUNCHER=ccache
          export CMAKE_CXX_COMPILER_LAUNCHER=ccache
          BUILD_TYPE=$([ "$IS_RELEASE" = "true" ] && echo "Release" || echo "Debug")
          cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=$BUILD_TYPE
          cmake --build build --target PocketDash -j$(nproc)
          if [ "$IS_RELEASE" = "true" ]; then
            strip build/bin/PocketDash/PocketDash
          fi

      - name: Package Linux Binary & Assets
        shell: bash
        run: |
          tar -czhf PocketDash-Linux-x64.tar.gz -C build/bin/PocketDash .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketDash-Linux-x64
          path: PocketDash-Linux-x64.tar.gz
          retention-days: 14

  # ====================================================================
  # Publish EAB / Release to GitHub Releases
  # ====================================================================
  publish_release:
    name: Publish GitHub Release
    needs: [windows, macos, ios, android, linux]
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.build_mode == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Prepare release metadata
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "title=PocketDash ${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=eab-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "title=PocketDash EAB #${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          prerelease: true
          generate_release_notes: true
          files: artifacts/*
name: Multiplatform Build (Windows, macOS, iOS, Android, Linux)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ====================================================================
  # Windows x64 Build
  # ====================================================================
  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Disable Windows Defender
        shell: pwsh
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
          Set-MpPreference -DisableBehaviorMonitoring $true -ErrorAction SilentlyContinue
          Set-MpPreference -DisableScriptScanning $true -ErrorAction SilentlyContinue

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup sccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          variant: sccache
          key: windows-sccache-v1
          max-size: 2G

      - name: Cache Axmol Engine
        id: cache-axmol
        uses: actions/cache@v4
        with:
          path: C:/axmol
          key: axmol-release-2.x-windows

      - name: Setup Axmol Engine
        if: steps.cache-axmol.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git clone --depth 1 -b release/2.x https://github.com/axmolengine/axmol.git C:/axmol
          cd C:/axmol
          ./setup.ps1

      - name: Build PocketDash (Windows)
        shell: pwsh
        run: |
          $env:AX_ROOT = "C:/axmol"
          $env:PATH = "C:/axmol/tools/cmdline;$env:PATH"
          $env:CMAKE_C_COMPILER_LAUNCHER = "sccache"
          $env:CMAKE_CXX_COMPILER_LAUNCHER = "sccache"
          axmol build -p win32 -a x64 -t PocketDash -O3

      - name: Package Windows Binary & Assets
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path . -Recurse -File -Filter "PocketDash.exe" | Select-Object -First 1
          if (-not $exe) {
            Write-Error "Could not locate PocketDash.exe"
            exit 1
          }
          $binDir = $exe.DirectoryName
          Write-Host "Found PocketDash binary directory at: $binDir"
          Compress-Archive -Path "$binDir/*" -DestinationPath "PocketDash-Windows-x64.zip"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketDash-Windows-x64
          path: PocketDash-Windows-x64.zip
          retention-days: 14

  # ====================================================================
  # macOS (Apple Silicon / arm64) Build
  # ====================================================================
  macos:
    name: macOS (arm64)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          variant: ccache
          key: macos-ccache-v1
          max-size: 2G

      - name: Cache Axmol Engine
        id: cache-axmol
        uses: actions/cache@v4
        with:
          path: /Users/runner/axmol
          key: axmol-release-2.x-macos

      - name: Setup Axmol Engine
        if: steps.cache-axmol.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone --depth 1 -b release/2.x https://github.com/axmolengine/axmol.git ${HOME}/axmol
          cd ${HOME}/axmol
          pwsh ./setup.ps1

      - name: Build PocketDash (macOS)
        shell: bash
        run: |
          export AX_ROOT="${HOME}/axmol"
          export PATH="${HOME}/axmol/tools/cmdline:${PATH}"
          export CMAKE_C_COMPILER_LAUNCHER=ccache
          export CMAKE_CXX_COMPILER_LAUNCHER=ccache
          axmol build -p osx -a arm64 -t PocketDash -O3 -xc '-DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO,-DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO'

      - name: Package macOS Application (.app)
        shell: bash
        run: |
          APP_DIR=$(find . -path "*osx*" -o -path "*build*" | grep -E "PocketDash\.app$" | grep -v "ios" | grep -v "sim" | head -n 1)
          if [ -z "$APP_DIR" ]; then
            APP_DIR=$(find . -name "PocketDash.app" -type d | grep -v "ios" | grep -v "sim" | head -n 1)
          fi
          if [ -z "$APP_DIR" ]; then
            echo "Error: PocketDash.app not found!"
            find . -name "*.app" || true
            exit 1
          fi
          echo "Packaging macOS app from: $APP_DIR"
          ditto -c -k --sequesterRsrc --keepParent "$APP_DIR" "PocketDash-macOS.zip"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketDash-macOS
          path: PocketDash-macOS.zip
          retention-days: 14

  # ====================================================================
  # iOS Build (Device IPA + Simulator App)
  # ====================================================================
  ios:
    name: iOS (Device & Simulator)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          variant: ccache
          key: ios-ccache-v1
          max-size: 2G

      - name: Cache Axmol Engine
        id: cache-axmol
        uses: actions/cache@v4
        with:
          path: /Users/runner/axmol
          key: axmol-release-2.x-macos

      - name: Setup Axmol Engine
        if: steps.cache-axmol.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone --depth 1 -b release/2.x https://github.com/axmolengine/axmol.git ${HOME}/axmol
          cd ${HOME}/axmol
          pwsh ./setup.ps1

      # 1. iOS Physical Device Build (arm64)
      - name: Build iOS Device (arm64)
        shell: bash
        run: |
          export AX_ROOT="${HOME}/axmol"
          export PATH="${HOME}/axmol/tools/cmdline:${PATH}"
          export CMAKE_C_COMPILER_LAUNCHER=ccache
          export CMAKE_CXX_COMPILER_LAUNCHER=ccache
          axmol build -p ios -a arm64 -t PocketDash -O3 -xc '-DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY=,-DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO,-DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO'

      - name: Package iOS Device IPA
        shell: bash
        run: |
          APP_DIR=$(find . -path "*ios*" -name "PocketDash.app" -type d | grep -v "sim" | head -n 1)
          if [ -n "$APP_DIR" ]; then
            echo "Packaging iOS Device IPA from: $APP_DIR"
            mkdir -p Payload
            cp -R "$APP_DIR" Payload/
            zip -qr "PocketDash-iOS.ipa" Payload
            rm -rf Payload
          else
            echo "Warning: iOS device app bundle not found!"
          fi

      # 2. iOS Simulator Build (for testing in Mac Simulator)
      - name: Build iOS Simulator (arm64)
        shell: bash
        run: |
          export AX_ROOT="${HOME}/axmol"
          export PATH="${HOME}/axmol/tools/cmdline:${PATH}"
          export CMAKE_C_COMPILER_LAUNCHER=ccache
          export CMAKE_CXX_COMPILER_LAUNCHER=ccache
          axmol build -p ios -a arm64 -sdk simulator -t PocketDash -O3

      - name: Package iOS Simulator App
        shell: bash
        run: |
          SIM_DIR=$(find . -path "*sim*" -name "PocketDash.app" -type d | head -n 1)
          if [ -n "$SIM_DIR" ]; then
            echo "Packaging iOS Simulator app from: $SIM_DIR"
            ditto -c -k --sequesterRsrc --keepParent "$SIM_DIR" "PocketDash-iOS-Simulator.zip"
          else
            echo "Warning: iOS Simulator app bundle not found!"
          fi

      - name: Upload iOS Device IPA
        if: hashFiles('PocketDash-iOS.ipa') != ''
        uses: actions/upload-artifact@v4
        with:
          name: PocketDash-iOS-Device-IPA
          path: PocketDash-iOS.ipa
          retention-days: 14

      - name: Upload iOS Simulator App
        if: hashFiles('PocketDash-iOS-Simulator.zip') != ''
        uses: actions/upload-artifact@v4
        with:
          name: PocketDash-iOS-Simulator
          path: PocketDash-iOS-Simulator.zip
          retention-days: 14

  # ====================================================================
  # Android Build (arm64 APK)
  # ====================================================================
  android:
    name: Android (arm64 APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Axmol Engine
        id: cache-axmol
        uses: actions/cache@v4
        with:
          path: /home/runner/axmol
          key: axmol-release-2.x-android

      - name: Clone Axmol Engine
        if: steps.cache-axmol.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone --depth 1 -b release/2.x https://github.com/axmolengine/axmol.git ${HOME}/axmol

      - name: Setup Axmol & Dependencies
        shell: bash
        run: |
          sudo chown -R $USER:$USER /usr/local/lib/android/sdk || true
          echo -e "y" | pwsh ${HOME}/axmol/setup.ps1

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          variant: ccache
          key: android-ccache-v1
          max-size: 2G

      - name: Build Android APK
        shell: bash
        run: |
          export AX_ROOT="${HOME}/axmol"
          export PATH="${HOME}/axmol/tools/cmdline:${PATH}"
          export NDK_CCACHE="$(which ccache)"
          export CMAKE_C_COMPILER_LAUNCHER=ccache
          export CMAKE_CXX_COMPILER_LAUNCHER=ccache
          chmod +x proj.android/gradlew
          axmol build -p android -a arm64

      - name: Package Android APK
        shell: bash
        run: |
          APK_FILE=$(find proj.android -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: APK not found!"
            find proj.android -name "*.apk" || true
            exit 1
          fi
          echo "Found APK at: $APK_FILE"
          cp "$APK_FILE" "PocketDash-Android-arm64.apk"

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketDash-Android-arm64
          path: PocketDash-Android-arm64.apk
          retention-days: 14

  # ====================================================================
  # Linux x64 Build
  # ====================================================================
  linux:
    name: Linux (x64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          variant: ccache
          key: linux-ccache-v1
          max-size: 2G

      - name: Cache Axmol Engine
        id: cache-axmol
        uses: actions/cache@v4
        with:
          path: /home/runner/axmol
          key: axmol-release-2.x-linux

      - name: Clone Axmol Engine
        if: steps.cache-axmol.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone --depth 1 -b release/2.x https://github.com/axmolengine/axmol.git ${HOME}/axmol

      - name: Install Linux System Dependencies
        shell: bash
        run: |
          echo -e "y" | pwsh ${HOME}/axmol/setup.ps1

      - name: Build PocketDash (Linux)
        shell: bash
        run: |
          export AX_ROOT="${HOME}/axmol"
          export PATH="${HOME}/axmol/tools/cmdline:${PATH}"
          export CMAKE_C_COMPILER_LAUNCHER=ccache
          export CMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target PocketDash -j$(nproc)

      - name: Package Linux Binary & Assets
        shell: bash
        run: |
          tar -czf PocketDash-Linux-x64.tar.gz -C build/bin/PocketDash .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketDash-Linux-x64
          path: PocketDash-Linux-x64.tar.gz
          retention-days: 14
